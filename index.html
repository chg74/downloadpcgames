<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top,#172554 0,#070b18 45%,#03050d 100%);
color:#fff;
min-height:100vh;
padding:20px;
}

button{
font-family:inherit;
}

#maintenance{
display:none;
text-align:center;
padding-top:120px;
}

#maintenance .icon{
font-size:70px;
margin-bottom:20px;
}

#maintenance h1{
font-size:30px;
margin-bottom:10px;
}

#maintenance p{
color:#94a3b8;
font-size:17px;
}

/* HEADER */

.header{
max-width:1100px;
margin:auto;
text-align:center;
padding:25px 10px 30px;
}

.logo{
font-size:42px;
font-weight:bold;
background:linear-gradient(90deg,#60a5fa,#a78bfa,#22d3ee);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
color:#94a3b8;
margin-top:8px;
font-size:16px;
}

.online{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:18px;
padding:9px 18px;
border:1px solid #22c55e55;
background:#052e16aa;
border-radius:30px;
color:#86efac;
font-size:15px;
}

/* MENU */

.menu{
max-width:1000px;
margin:10px auto 35px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.box{
position:relative;
overflow:hidden;
background:linear-gradient(145deg,#172554,#0f172a);
border:1px solid #334155;
border-radius:25px;
padding:35px 20px;
text-align:center;
cursor:pointer;
transition:.3s;
box-shadow:0 15px 40px #0008;
}

.box:hover{
transform:translateY(-6px);
border-color:#60a5fa;
box-shadow:0 20px 45px #000b;
}

.box .emoji{
font-size:50px;
margin-bottom:15px;
}

.box h2{
font-size:23px;
}

.box p{
color:#94a3b8;
margin-top:8px;
}

.free{
border-color:#16a34a55;
}

.paid{
border-color:#f59e0b55;
}

/* CONTENT */

#content{
display:none;
max-width:1100px;
margin:auto;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:25px;
}

.title{
font-size:28px;
}

.back{
background:#1e293b;
border:1px solid #475569;
color:#fff;
padding:11px 20px;
border-radius:13px;
cursor:pointer;
transition:.2s;
}

.back:hover{
background:#334155;
}

/* GAMES */

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.card{
background:linear-gradient(145deg,#1e293b,#0f172a);
border:1px solid #334155;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px #0008;
transition:.3s;
}

.card:hover{
transform:translateY(-7px);
border-color:#60a5fa;
}

.card-img{
width:100%;
height:210px;
object-fit:cover;
display:block;
}

.card-info{
padding:15px;
}

.card h2{
font-size:18px;
margin-bottom:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.price{
font-size:20px;
font-weight:bold;
color:#fbbf24;
margin-bottom:13px;
}

.free-label{
font-size:15px;
color:#4ade80;
margin-bottom:13px;
}

.buy{
display:block;
width:100%;
border:0;
border-radius:12px;
padding:12px;
background:linear-gradient(90deg,#f59e0b,#ea580c);
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.buy:hover{
transform:scale(1.03);
filter:brightness(1.1);
}

.download{
display:block;
width:100%;
border:0;
border-radius:12px;
padding:12px;
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.empty{
grid-column:1/-1;
text-align:center;
padding:70px 20px;
color:#94a3b8;
font-size:20px;
}

/* TELEGRAM */

.telegram{
position:fixed;
right:18px;
bottom:22px;
width:60px;
height:60px;
background:#229ED9;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 8px 25px #0009;
z-index:999;
transition:.3s;
}

.telegram:hover{
transform:scale(1.1);
}

.telegram img{
width:37px;
height:37px;
}

/* MOBILE */

@media(max-width:600px){

body{
padding:12px;
}

.logo{
font-size:32px;
}

.menu{
grid-template-columns:1fr;
gap:15px;
}

.box{
padding:27px 15px;
}

.games{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card-img{
height:170px;
}

.card-info{
padding:11px;
}

.card h2{
font-size:16px;
}

.price{
font-size:18px;
}

.buy,.download{
font-size:14px;
padding:10px 5px;
}

.topbar{
align-items:flex-start;
}

.title{
font-size:22px;
}

.telegram{
width:55px;
height:55px;
}

}

</style>

</head>

<body>

<!-- الصيانة -->

<div id="maintenance">

<div class="icon">🔧</div>

<h1>الموقع تحت الصيانة</h1>

<p>نرجع لكم قريبًا ❤️</p>

</div>


<!-- الموقع -->

<div id="site">

<header class="header">

<div class="logo">🎮 GAME STORE</div>

<div class="subtitle">
متجر ألعاب الكمبيوتر
</div>

<div class="online">
🟢 متصل الآن :
<span id="count">100</span>
</div>

</header>


<!-- القائمة -->

<div id="home">

<div class="menu">

<div class="box free" onclick="openGames()">

<div class="emoji">🎮</div>

<h2>الألعاب المجانية</h2>

<p>تحميل ألعاب الكمبيوتر مجانًا</p>

</div>


<div class="box paid" onclick="openPaid()">

<div class="emoji">💰</div>

<h2>الألعاب المدفوعة</h2>

<p>ألعاب مميزة للشراء</p>

</div>

</div>

</div>


<!-- المحتوى -->

<div id="content">

<div class="topbar">

<div class="title" id="sectionTitle">
🎮 الألعاب
</div>

<button class="back" onclick="backHome()">
⬅ رجوع
</button>

</div>

<div class="games" id="list"></div>

</div>


</div>


<!-- Telegram -->

<a
href="https://t.me/expertpca"
target="_blank"
class="telegram"
title="Telegram">

<img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">

</a>


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>

firebase.initializeApp({

apiKey:"AIzaSyAUc2cH9gVE7RECiW19XQXJNZQxVH96sFE",

authDomain:"zezo-59a8d.firebaseapp.com",

databaseURL:"https://zezo-59a8d-default-rtdb.firebaseio.com",

projectId:"zezo-59a8d"

});


const db=firebase.database();

const list=document.getElementById("list");

let currentRef=null;


/* الصيانة */

db.ref("settings/maintenance").on("value",snap=>{

if(snap.val()===true){

document.getElementById("site").style.display="none";

document.getElementById("maintenance").style.display="block";

}else{

document.getElementById("site").style.display="block";

document.getElementById("maintenance").style.display="none";

}

});


/* عدد المتصلين - شكل تجريبي */

let onlineNumber=Math.floor(Math.random()*300)+100;

document.getElementById("count").textContent=onlineNumber;


setInterval(()=>{

let change=Math.floor(Math.random()*80)+20;

if(Math.random()>0.5){

onlineNumber+=change;

}else{

onlineNumber-=Math.floor(change/2);

}

if(onlineNumber<90) onlineNumber=90;

if(onlineNumber>5000) onlineNumber=5000;

document.getElementById("count").textContent=onlineNumber;

},60000);


/* عرض البيانات */

function showData(type,title){

document.getElementById("home").style.display="none";

document.getElementById("content").style.display="block";

document.getElementById("sectionTitle").textContent=title;

list.innerHTML="<div class='empty'>⏳ جاري تحميل الألعاب...</div>";


if(currentRef){

currentRef.off();

}


currentRef=db.ref(type);


currentRef.once("value",snap=>{

list.innerHTML="";


if(!snap.exists()){

list.innerHTML="<div class='empty'>😔 لا يوجد ألعاب حاليًا</div>";

return;

}


snap.forEach(item=>{

let data=item.val();

let card=document.createElement("div");

card.className="card";


if(type==="patches"){

card.innerHTML=`

<img class="card-img"
src="${escapeHTML(data.image)}"
onerror="this.src='https://via.placeholder.com/500x500?text=Game'">

<div class="card-info">

<h2>${escapeHTML(data.name)}</h2>

<div class="price">
💰 ${escapeHTML(data.price || "غير محدد")} جنيه
</div>

<button class="buy"
onclick="buyGame('${encodeURIComponent(data.name || "")}','${encodeURIComponent(data.price || "")}')">

🛒 شراء الآن

</button>

</div>

`;

}else{

card.innerHTML=`

<img class="card-img"
src="${escapeHTML(data.image)}"
onerror="this.src='https://via.placeholder.com/500x500?text=Game'">

<div class="card-info">

<h2>${escapeHTML(data.name)}</h2>

<div class="free-label">
🟢 مجانية
</div>

<button class="download"
onclick="downloadGame('${encodeURIComponent(data.link || "")}')">

⬇ تحميل اللعبة

</button>

</div>

`;

}


list.appendChild(card);

});

});

}


/* الألعاب المجانية */

function openGames(){

showData(
"games",
"🎮 الألعاب المجانية"
);

}


/* الألعاب المدفوعة */

function openPaid(){

showData(
"patches",
"✨ الألعاب المدفوعة"
);

}


/* شراء اللعبة */

function buyGame(name,price){

let gameName=decodeURIComponent(name);

let gamePrice=decodeURIComponent(price);

let message=
"السلام عليكم 👋%0A%0A"+
"أريد شراء لعبة: "+encodeURIComponent(gameName)+
"%0Aالسعر: "+encodeURIComponent(gamePrice)+" جنيه";


window.open(
"https://t.me/expertpca?text="+message,
"_blank"
);

}


/* تحميل المجاني */

function downloadGame(link){

window.open(
decodeURIComponent(link),
"_blank"
);

}


/* رجوع */

function backHome(){

if(currentRef){

currentRef.off();

currentRef=null;

}

document.getElementById("content").style.display="none";

document.getElementById("home").style.display="block";

}


/* حماية بسيطة للنصوص */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>

  </html>
